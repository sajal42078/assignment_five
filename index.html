<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<link rel="stylesheet" href="style.css">

    <title>Document</title>


</head>
<body>
   
    <!-- login form  -->
     <section class="login_form w-1/3 mx-auto my-10">

      <fieldset class="fieldset bg-base-200 border-base-300 rounded-box border p-8">
         <div class="flex flex-col justify-center items-center mb-3">
        <img src="assets/github-logo.png" alt="">
   <h2 class="text-2xl font-semibold">GitHub Issues Tracker</h2>
   <p class="text-[#64748B]">Sign in to manage your issues</p>
      </div>

      <div class="my-3">
        <label class="label font-semibold">Username</label>
  <input type="text" class="input w-full" placeholder="Enter Username" />
  <p class="text-[#4A00FF]">Default: admin</p>
      </div>
  
      <div>
        <label class="label font-semibold">Password</label>
  <input type="password" class="input w-full" placeholder="Enter Password" />
  <p class="text-[#4A00FF]">Default: admin123</p>

      </div>
  
  <button class="btn bg-[#4A00FF] text-white btn-neutral mt-4">Sign In</button>
</fieldset>
     </section>

  
</body>
</html>
