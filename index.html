<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


<link rel="stylesheet" href="style.css">

    <title>Document</title>


</head>
<body>
   
    <!-- login form  -->
     <section id="login_page" class="login_form w-1/3 mx-auto my-10">

      <fieldset class="fieldset bg-base-200 border-base-300 rounded-box border p-8">
         <div class="flex flex-col justify-center items-center mb-3">
        <img src="assets/github-logo.png" alt="">
   <h2 class="text-2xl font-semibold">GitHub Issues Tracker</h2>
   <p class="text-[#64748B]">Sign in to manage your issues</p>
      </div>

      <div class="my-3">
        <label class="label font-semibold">Username</label>
  <input id="username" type="text" class="input w-full" placeholder="Enter Username" />
  <p class="text-[#4A00FF]">Default: admin</p>
      </div>
  
      <div>
        <label class="label font-semibold">Password</label>
  <input id="password" type="password" class="input w-full" placeholder="Enter Password" />
  <p class="text-[#4A00FF]">Default: admin123</p>

      </div>
  
  <button id="signin-btn" class="btn bg-[#4A00FF] text-white btn-neutral mt-4">Sign In</button>
</fieldset>
     </section>

     <section id="dashbord" class="hidden"> 

      <div id="navbar" class="flex w-full justify-between items-center px-20 py-3 shadow-md mb-10">

        <div class="flex items-center gap-2">
          <img class="w-9" src="assets/github-logo.png" alt="">
          <h2 class="font-semibold text-xl">GitHub Issues Tracker</h2>
        </div>

        <div class="flex items-center gap-2">
          <label class="input">
         <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
           <g
           stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="2.5"
            fill="none"
            stroke="currentColor"
    >
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
            </g>
            </svg>
              <input id="search_item" type="text" required placeholder="Search issues..." />
              
              </label>
              <button id="searchbtn" onclick="search()" class="btn bg-[#1A77F2] text-gray-50 border-[#005fd8]">search</button>
        </div>
      </div>

      <div id="pages-btn" class="flex justify-start ml-50 mr-50 mb-7 shadow-lg gap-2 mb-1">
        <div class="p-2">
          <button id="all" onclick="all_issues()" class="btn border-gray-400">All</button>
        <button id="open" onclick="openIssues()" class="btn border-gray-400">Open</button>
        <button id="closed" onclick="closedIssues()" class="btn border-gray-400">Closed</button>
        </div>
      </div>

      <div id="issues-counter" class="flex justify-between ml-50 mr-50 mb-1 shadow-lg">
        
      </div>

      </section>
      <section id="cards_container">
         <section id="cards" class=" ml-50 mr-50 mb-20 shadow-lg grid grid-cols-4 gap-3 p-6">

          </section>
      </section>
     
  
</body>


<script src="script.js"></script>

</html>
